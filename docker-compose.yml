services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Must match the host user that runs scripts/*.py (see `id -u` / `id -g`).
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    container_name: mirrormessiah-web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      # GATE_KEY: Primary access for users/family
      - GATE_KEY=${GATE_KEY:?GATE_KEY is not set.}
      # ADMIN_KEY: Required for management (Local Dev) and master login
      - ADMIN_KEY=${ADMIN_KEY:?ADMIN_KEY is not set.}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - DB_PATH=/app/data/media.db
      - MEDIA_DIR=${MEDIA_DIR}
      - SERIES_DIR=${SERIES_DIR}
      - COURSES_DIR=${COURSES_DIR}
      - LEGACY_COURSES_DIRS=${LEGACY_COURSES_DIRS:-}
      - MEDIA_ROOT=${MEDIA_ROOT:-/media/tushita}
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      # CLI-only keys (scripts/mm.py fetch-subs, scripts/courses_cli.py scrape)
      - OPENSUBS_API_KEY=${OPENSUBS_API_KEY:-}
      - OPENSUBS_USERNAME=${OPENSUBS_USERNAME:-}
      - OPENSUBS_PASSWORD=${OPENSUBS_PASSWORD:-}
      - OPENSUBS_DEV_MODE=${OPENSUBS_DEV_MODE:-1}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      # Set to true when served over HTTPS (e.g. the Cloudflare tunnel); plain-HTTP LAN access needs false.
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
    ports:
      # BIND_ADDR=0.0.0.0 serves every LAN interface; use a single LAN IP or 127.0.0.1 to restrict.
      # APP_PORT and APP_PORT_ALT must differ.
      - "${BIND_ADDR:-0.0.0.0}:${APP_PORT:-80}:3000"
      - "${BIND_ADDR:-0.0.0.0}:${APP_PORT_ALT:-3000}:3000"
    volumes:
      # Shared with the host CLI (python3 scripts/mm.py uses ./data/media.db by default).
      - ./data:/app/data
      # Parent mount: movies (W11_DATA) and courses (LINUX_DATA) often live under one parent.
      - "${MEDIA_ROOT:-/media/tushita}:${MEDIA_ROOT:-/media/tushita}:ro"
      # MEDIA_DIR: Path to your movie collection. Mounted as rw for poster management by mm.py
      - "${MEDIA_DIR:?MEDIA_DIR is not set.}:${MEDIA_DIR}"
      # SERIES_DIR: Path to your series collection
      - "${SERIES_DIR:?SERIES_DIR is not set.}:${SERIES_DIR}"
      # COURSES_DIR: Path to your course library (Udemy, Rebelway, etc.)
      - "${COURSES_DIR:?COURSES_DIR is not set.}:${COURSES_DIR}"
    networks:
      internal-net:
        aliases:
          - mirrormessiah
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/login', r => process.exit(r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Internet exposure is opt-in: docker compose --profile tunnel up -d
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: mirrormessiah-tunnel
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:-}
    depends_on:
      web:
        condition: service_healthy
    networks:
      - internal-net

networks:
  internal-net:
    driver: bridge
